name: Pi-router

on:
  # Triggers on push or pull request events for all branches.
  # Doc-only changes don't trigger the build to save runner minutes.
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**.md"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: List contents
        run: ls -R .
      - uses: actions/checkout@v5

      # Node.js LTS version
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Restore apt-cache
        uses: actions/cache/restore@v5
        id: cache-apt
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-apt-cache-${{ env.cache-name }}-${{ hashFiles('depends') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Save build dependencies
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.cache-apt.outputs.cache-primary-key }}

      - name: Populate /var/cache/apt/archives
        if: steps.cache-apt.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /var/cache/apt/archives
          # Preserve existing files, then copy the restored ones over.
          sudo cp -a ${{ runner.temp }}/apt-archives/* /var/cache/apt/archives/ || true
        shell: bash

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes coreutils quilt parted qemu-user-static debootstrap zerofree \
          zip dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc

      - name: Prepare apt cache for archiving
        if: always()
        run: |
          sudo chmod -R a+r /var/cache/apt/archives 2>/dev/null || true
          sudo find /var/cache/apt/archives -type d -exec sudo chmod a+x {} \; 2>/dev/null || true
          sudo rm -f /var/cache/apt/archives/lock 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/partial 2>/dev/null || true
          # Copy back to the temp location so the cache action can archive it.
          mkdir -p ${{ runner.temp }}/apt-archives
          sudo cp -a /var/cache/apt/archives/* ${{ runner.temp }}/apt-archives/
        shell: bash

      - name: Determine artifact base name
        id: names
        run: |
          IMG_DATE=$(date +%Y-%m-%d)
          IMG_NAME="pi-router"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            # GITHUB_REF is refs/tags/v1.2.3 → strip the leading "refs/tags/"
            SUFFIX="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # GITHUB_REF is refs/pull/123/merge → keep only the PR number
            PR_NUM=$(echo "${GITHUB_REF}" | cut -d'/' -f3)
            SUFFIX="pr-${PR_NUM}"
          else
            # For pushes on branches – use the branch name, replace '/' with '-'
            BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            SUFFIX="${BRANCH}"
          fi
          IMG_FILENAME="${IMG_DATE}-${IMG_NAME}-${SUFFIX}"
          ZIP_FILENAME="image_${IMG_DATE}-${IMG_NAME}-${SUFFIX}"

          echo "IMG_FILENAME=${IMG_FILENAME}" >> "$GITHUB_ENV"
          echo "ZIP_FILENAME=${ZIP_FILENAME}" >> "$GITHUB_ENV"
          # Deploy zip only for tags/releases
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]] || \
             { [[ "${GITHUB_EVENT_NAME}" == "push" ]] && [[ "${GITHUB_REF_TYPE}" == "tag" ]]; }; then
            echo "DEPLOY_ZIP=1" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ZIP=0" >> "$GITHUB_ENV"
          fi

      - name: Build pi-router
        env:
          IMG_FILENAME: ${{ env.IMG_FILENAME }}
          ZIP_FILENAME: ${{ env.ZIP_FILENAME }}
        run: |
          echo "Building image ${IMG_FILENAME}.img"
          sudo bash ./build.sh
          echo Done.

      - name: Upload image artifact
        uses: actions/upload-artifact@v5
        with:
          name: "${{ env.IMG_FILENAME }}"
          path: "deploy/${IMG_FILENAME}.img"

      - name: Upload zip artifact
        if: env.DEPLOY_ZIP == '1'
        uses: actions/upload-artifact@v5
        with:
          name: "${{ env.ZIP_FILENAME }}"
          path: "deploy/${ZIP_FILENAME}.zip"

      # Release‑specific steps (optional)
      - name: Create release
        id: create_release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pi‑router ${{ github.ref_name }}"
          generate_release_notes: true

      - name: Upload zip to release
        if: github.event_name == 'release' && github.event.action == 'published' && env.DEPLOY_ZIP == '1'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "deploy/${ZIP_FILENAME}.zip"
          asset_name: "${ZIP_FILENAME}.zip"
          asset_content_type: application/zip
